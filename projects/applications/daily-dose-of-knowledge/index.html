<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ken's Daily" />
  <meta id="theme-meta" name="theme-color" content="#1D5C5C" />
  <title>Ken's Daily Dose of Knowledge</title>
  <link rel="icon" href="../../../assets/G-logo-amber.png" type="image/png">
  <link rel="apple-touch-icon" href="../../../assets/G-logo-amber.png">

  <style>
    /* =====================================================
       RESET
    ===================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      /* #app uses position:fixed to anchor to physical screen edges.
         html background matches the nav bar color so any gap in PWA
         standalone mode is visually seamless (same color, invisible). */
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #f8f6f2; /* light mode nav color — default */
    }
    @media (prefers-color-scheme: dark) {
      html { background: #0a1212; } /* dark mode nav color */
    }

    body {
      /* height:100% inherits from html. #app uses position:fixed for actual sizing. */
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--nav-bg); /* matches nav — gap becomes invisible */
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
    }

    /* =====================================================
       THEME VARIABLES  (light is default)
    ===================================================== */
    body {
      --teal:         #1D5C5C;
      --teal-mid:     #2A7070;
      --teal-light:   #2E8080;
      --accent:       #FFBD59;
      --earth:        #A74927;
      --earth-light:  #C85A35;

      --bg:           #F4F1EE;
      --surface:      #FFFFFF;
      --surface-2:    #F0EDE9;
      --text-1:       #1A1A2E;
      --text-2:       #5C6B7A;
      --text-3:       #9AA5B4;
      --divider:      rgba(0,0,0,0.07);
      --shadow-card:  0 2px 16px rgba(0,0,0,0.07), 0 6px 32px rgba(0,0,0,0.05);
      --nav-bg:       rgba(248,246,242,0.94);
      --nav-border:   rgba(0,0,0,0.1);
      --bg-top:       #e0efef;

      --r-card:   20px;
      --r-btn:    12px;
      --r-pill:   100px;
    }

    body.dark {
      --bg:           #0D1E1E;
      --surface:      #192929;
      --surface-2:    #1F3535;
      --text-1:       #EFF0EC;
      --text-2:       #85989A;
      --text-3:       #4D6464;
      --divider:      rgba(255,255,255,0.07);
      --shadow-card:  0 4px 28px rgba(0,0,0,0.45);
      --nav-bg:       rgba(10,18,18,0.95);
      --nav-border:   rgba(255,255,255,0.07);
      --bg-top:       #122828;
    }

    /* =====================================================
       APP SHELL
    ===================================================== */
    #app {
      /* position:fixed with all edges at 0 anchors to the PHYSICAL screen
         corners — bypasses all viewport height calculations entirely.
         This is the same pattern ChatGPT uses to fill edge-to-edge on iOS.
         #bottom-nav padding (env safe-area-inset-bottom) keeps content above
         the home indicator; the nav background covers the safe area visually. */
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: radial-gradient(ellipse 100% 40% at 50% 0%, var(--bg-top) 0%, var(--bg) 60%);
      color: var(--text-1);
      transition: background 0.35s ease, color 0.35s ease;
    }

    /* =====================================================
       HEADER
    ===================================================== */
    #header {
      flex-shrink: 0;
      padding: 14px 18px 10px;
      padding-top: calc(14px + env(safe-area-inset-top));
      animation: fadeDown 0.5s ease both;
    }

    .hdr-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hdr-brand {
      flex: 1;
      min-width: 0;
    }

    .hdr-eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .hdr-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-1);
      letter-spacing: -0.4px;
      line-height: 1.15;
      font-family: Georgia, "Times New Roman", serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hdr-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Streak badge */
    .streak-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      background: rgba(255,189,89,0.14);
      border: 1px solid rgba(255,189,89,0.32);
      border-radius: var(--r-pill);
      transition: background 0.2s;
    }

    .streak-fire { font-size: 14px; }

    .streak-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* Header icon buttons */
    .hdr-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      background: var(--surface-2);
      color: var(--text-2);
      transition: transform 0.15s, background 0.2s;
    }

    .hdr-btn:active { transform: scale(0.88); }

    /* =====================================================
       MAIN SCROLLABLE AREA
    ===================================================== */
    #main {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .tab-pane {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 0 16px;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
      opacity: 0;
      pointer-events: none;
      transform: translateX(22px);
      transition: opacity 0.26s ease, transform 0.26s ease;
    }

    /* hide scrollbar everywhere */
    .tab-pane::-webkit-scrollbar { display: none; }
    .tab-pane { -ms-overflow-style: none; scrollbar-width: none; }

    .tab-pane.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .tab-pane.exit-left {
      opacity: 0;
      transform: translateX(-22px);
    }

    /* =====================================================
       DATE ROW
    ===================================================== */
    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 2px 12px;
      animation: fadeDown 0.5s 0.05s ease both;
    }

    .date-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-1);
    }

    .preview-badge {
      display: none;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }

    .preview-badge.visible { display: flex; }

    .day-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--teal);
      padding: 4px 11px;
      background: rgba(29,92,92,0.1);
      border-radius: var(--r-pill);
    }

    body.dark .day-pill {
      background: rgba(29,92,92,0.28);
      color: #5DB8B8;
    }

    /* =====================================================
       CARD BASE
    ===================================================== */
    .card {
      border-radius: var(--r-card);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(22px);
      transition: box-shadow 0.3s, background 0.3s;
    }

    .card.in {
      animation: slideUp 0.52s ease-out forwards;
    }

    .word-card.in  { animation-delay: 0.05s; }
    .idiom-card.in { animation-delay: 0.2s;  }

    /* Card gradient header */
    .card-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 10px 16px;
    }

    .card-hdr-teal { background: linear-gradient(135deg, #1D5C5C 0%, #2E8080 100%); }
    .card-hdr-rust { background: linear-gradient(135deg, #A74927 0%, #C85A35 100%); }

    .card-type {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    .card-type-icon { font-size: 14px; }

    .card-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Small round icon buttons inside card header */
    .cbtn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.9);
      font-size: 15px;
      transition: background 0.2s, transform 0.15s;
    }

    .cbtn:active { background: rgba(255,255,255,0.32); transform: scale(0.88); }

    .cbtn.fav-on { color: #FF6B8A; }

    .cbtn.pop {
      animation: heartPop 0.38s cubic-bezier(.36,.07,.19,.97);
    }

    /* Card body */
    .card-body {
      padding: 20px 20px 22px;
    }

    .card-divider {
      height: 1px;
      background: var(--divider);
      margin: 14px 0;
    }

    /* Section labels */
    .sec-lbl {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 5px;
    }

    .sec-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-2);
      margin-bottom: 14px;
    }

    .sec-example {
      display: flex;
      gap: 10px;
      font-size: 14px;
      font-style: italic;
      line-height: 1.65;
      color: var(--text-2);
    }

    .ex-bar {
      width: 3px;
      min-width: 3px;
      border-radius: 2px;
      background: var(--accent);
      flex-shrink: 0;
      align-self: stretch;
    }

    /* =====================================================
       WORD CARD SPECIFIC
    ===================================================== */
    .word-title {
      font-size: clamp(26px, 8vw, 34px);
      font-weight: 800;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text-1);
      line-height: 1.12;
      margin-bottom: 8px;
    }

    .word-pron {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--teal);
      font-family: "Courier New", Courier, monospace;
      padding: 4px 12px;
      background: rgba(29,92,92,0.08);
      border-radius: var(--r-pill);
      margin-bottom: 16px;
    }

    body.dark .word-pron {
      background: rgba(46,128,128,0.2);
      color: #5BBFBF;
    }

    /* =====================================================
       IDIOM CARD SPECIFIC
    ===================================================== */
    .idiom-title {
      font-size: clamp(19px, 5.5vw, 25px);
      font-weight: 800;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text-1);
      line-height: 1.3;
      margin-bottom: 16px;
    }

    /* =====================================================
       TESTING TOOLS
    ===================================================== */
    .testing-section {
      margin-top: 4px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--surface-2);
      border: 1px solid var(--divider);
      animation: slideUp 0.52s 0.35s ease-out both;
    }

    .testing-lbl {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 10px;
    }

    .testing-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tbtn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 15px;
      border-radius: var(--r-pill);
      font-size: 13px;
      font-weight: 700;
      transition: opacity 0.15s, transform 0.15s;
    }

    .tbtn:active { transform: scale(0.95); opacity: 0.8; }

    .tbtn.t-primary {
      background: rgba(29,92,92,0.12);
      color: var(--teal);
    }

    body.dark .tbtn.t-primary {
      background: rgba(46,128,128,0.22);
      color: #5BBFBF;
    }

    .tbtn.t-secondary {
      background: var(--surface);
      color: var(--text-2);
      border: 1px solid var(--divider);
    }

    /* =====================================================
       FAVORITES TAB
    ===================================================== */
    .fav-hdr {
      font-size: 28px;
      font-weight: 800;
      font-family: Georgia, serif;
      color: var(--text-1);
      padding: 16px 2px 4px;
    }

    .fav-sec-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 2px 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-3);
      letter-spacing: 0.4px;
    }

    .fav-count {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      background: var(--surface-2);
      border-radius: var(--r-pill);
      color: var(--text-3);
    }

    .fav-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 14px 14px 14px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 9px;
      transition: background 0.3s;
    }

    .fav-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .fav-icon-word  { background: linear-gradient(135deg, #1D5C5C, #2E8080); }
    .fav-icon-idiom { background: linear-gradient(135deg, #A74927, #C85A35); }

    .fav-body {
      flex: 1;
      min-width: 0;
    }

    .fav-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fav-sub {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .fav-del {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--text-3);
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, transform 0.12s;
    }

    .fav-del:active {
      background: rgba(255,59,48,0.12);
      color: #FF3B30;
      transform: scale(0.88);
    }

    /* Empty state */
    .fav-empty {
      text-align: center;
      padding: 64px 24px 40px;
    }

    .fav-empty-icon {
      font-size: 52px;
      margin-bottom: 16px;
      opacity: 0.35;
      display: block;
    }

    .fav-empty-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    .fav-empty-sub {
      font-size: 14px;
      color: var(--text-3);
      line-height: 1.6;
    }

    /* =====================================================
       BOTTOM NAVIGATION
    ===================================================== */
    #bottom-nav {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      background: var(--nav-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--nav-border);
      padding: 12px 0 max(env(safe-area-inset-bottom), 14px);
      transition: background 0.35s, border-color 0.35s;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      padding: 0 0 8px 0;
      color: var(--text-3);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: color 0.2s, transform 0.15s;
    }

    .nav-btn:active { transform: scale(0.9); }

    .nav-btn.active { color: var(--teal); }
    body.dark .nav-btn.active { color: #5BBFBF; }

    .nav-ico {
      font-size: 30px;
      line-height: 1;
      transition: transform 0.2s;
    }

    .nav-btn.active .nav-ico { transform: translateY(-1px); }

    /* Active indicator dot */
    .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--teal);
      margin-top: 1px;
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.2s, transform 0.2s;
    }

    body.dark .nav-dot { background: #5BBFBF; }
    .nav-btn.active .nav-dot { opacity: 1; transform: scale(1); }

    /* =====================================================
       TOAST
    ===================================================== */
    #toast {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: rgba(20,20,20,0.88);
      color: #fff;
      padding: 9px 18px;
      border-radius: var(--r-pill);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 999;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    body.dark #toast {
      background: rgba(240,240,240,0.14);
      border: 1px solid rgba(255,255,255,0.14);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =====================================================
       ANIMATIONS
    ===================================================== */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0);     }
    }

    @keyframes heartPop {
      0%   { transform: scale(1);    }
      35%  { transform: scale(1.5);  }
      65%  { transform: scale(0.88); }
      100% { transform: scale(1);    }
    }

    /* =====================================================
       HOVER (desktop / trackpad users)
    ===================================================== */
    @media (hover: hover) {
      .cbtn:hover         { background: rgba(255,255,255,0.28); }
      .hdr-btn:hover      { background: var(--divider); }
      .tbtn.t-primary:hover  { background: rgba(29,92,92,0.2); }
      .fav-del:hover      { background: rgba(255,59,48,0.1); color: #FF3B30; }
    }

    /* =====================================================
       STATS ROW  (streak / longest / missed)
    ===================================================== */
    .stats-row {
      display: flex;
      gap: 8px;
      padding: 0 2px 14px;
      animation: fadeDown 0.5s 0.08s ease both;
    }

    .stat-chip {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 9px 6px 8px;
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow-card);
      transition: background 0.3s;
    }

    .stat-chip-icon {
      font-size: 16px;
      line-height: 1;
    }

    .stat-chip-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-1);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .stat-chip-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-3);
    }

    /* TTS button — keep same look as existing .cbtn */
    .cbtn.tts-active {
      background: rgba(255,255,255,0.38);
      animation: ttspulse 1s ease-in-out infinite;
    }

    @keyframes ttsplus {
      0%, 100% { opacity: 1;   }
      50%       { opacity: 0.6; }
    }

    @keyframes ttsrings {
      0%   { box-shadow: 0 0 0 0px rgba(255,255,255,0.5); }
      100% { box-shadow: 0 0 0 8px rgba(255,255,255,0);   }
    }

    @keyframes ttsactive {
      0%, 100% { background: rgba(255,255,255,0.18); }
      50%       { background: rgba(255,255,255,0.38); }
    }

    .cbtn.tts-active {
      animation: ttsactive 1s ease-in-out infinite;
    }

    @media (hover: none), (pointer: coarse) {
      /* .cbtn is 34x34 and .hdr-btn 36x36 — small in both directions, so unlike
         a wide header link there is no spare area to forgive a near miss. The
         circles are the design, so grow the hit area instead of the button:
         a transparent ::after takes each to 44x44 with nothing visible changing. */
      .cbtn, .hdr-btn { position: relative; }
      .cbtn::after,
      .hdr-btn::after {
        content: '';
        position: absolute;
        inset: -5px;
        border-radius: inherit;
      }
      .hdr-btn::after { inset: -4px; }

      /* 9px is below any readable floor; these label the stat chips. */
      .stat-chip-label { font-size: 11px; letter-spacing: 0.5px; }
    }

  </style>
</head>

<body>
<div id="app">

  <!-- ── HEADER ─────────────────────────────────────────── -->
  <header id="header">
    <div class="hdr-row">
      <div class="hdr-brand">
        <div class="hdr-eyebrow">Ken's Daily</div>
        <div class="hdr-title">Dose of Knowledge</div>

  { id:47, idiom:"Drive someone up the wall", meaning:"To make someone very irritated or annoyed.", ex:"The constant background noise in the open office drove him up the wall." },
  { id:48, idiom:"Drop the ball", meaning:"To make a mistake; to fail to follow through on a responsibility.", ex:"The communications team dropped the ball on announcing the event in time." },
  { id:49, idiom:"Every cloud has a silver lining", meaning:"Every difficult or negative situation has at least one positive aspect.", ex:"She lost her flight but met her future business partner at the gate — every cloud has a silver lining." },
  { id:50, idiom:"Face the music", meaning:"To accept the unpleasant consequences of one's actions.", ex:"He'd been avoiding the issue for months, but finally had to face the music." },
  { id:51, idiom:"Fall on your sword", meaning:"To accept blame or punishment to protect others.", ex:"The minister fell on his sword rather than letting his team take the blame." },
  { id:52, idiom:"Fit as a fiddle", meaning:"In excellent physical health.", ex:"Despite his age, he was fit as a fiddle after decades of daily hiking." },
  { id:53, idiom:"Fly off the handle", meaning:"To suddenly become very angry.", ex:"He flew off the handle when he discovered the report had been deleted." },
  { id:54, idiom:"Get a taste of your own medicine", meaning:"To experience the same unpleasant treatment that one has given to others.", ex:"After years of being rude to staff, he got a taste of his own medicine when his team quit." },
  { id:55, idiom:"Get the ball rolling", meaning:"To start an activity or process.", ex:"She proposed the first agenda item to get the ball rolling in the meeting." },
  { id:56, idiom:"Give the benefit of the doubt", meaning:"To trust someone despite some uncertainty about their motives.", ex:"She had no proof, but she gave him the benefit of the doubt and let him explain." },
  { id:57, idiom:"Go back to basics", meaning:"To return to the fundamental principles of a subject or activity.", ex:"When the team was struggling, the coach told them to go back to basics." },
  { id:58, idiom:"Go the extra mile", meaning:"To put in more effort than is required.", ex:"The nurse always went the extra mile, staying late to comfort anxious patients." },
  { id:59, idiom:"Good things come to those who wait", meaning:"Patience is eventually rewarded.", ex:"It took five years, but the business finally took off — good things come to those who wait." },
  { id:60, idiom:"Have a chip on your shoulder", meaning:"To carry a long-standing grievance; to feel resentful.", ex:"He still had a chip on his shoulder about being passed over for promotion." },
  { id:61, idiom:"Have your head in the clouds", meaning:"To be out of touch with reality; to daydream.", ex:"Her plans sound wonderful, but she has her head in the clouds about the cost." },
  { id:62, idiom:"Hit the books", meaning:"To study hard.", ex:"Exams are next week — it's time to hit the books." },
  { id:63, idiom:"Hit the nail on the head", meaning:"To identify the exact problem or provide the precisely correct answer.", ex:"His analysis hit the nail on the head — everyone in the room nodded in agreement." },
  { id:64, idiom:"Hold your horses", meaning:"To slow down; to wait and be patient.", ex:"Hold your horses — we haven't finished reviewing the proposal yet." },
  { id:65, idiom:"Ignorance is bliss", meaning:"Not knowing about something unpleasant can mean you are happier not knowing.", ex:"She decided not to read the reviews before opening night — ignorance is bliss." },
  { id:66, idiom:"In hot water", meaning:"In a difficult situation; in trouble.", ex:"He found himself in hot water after the email was accidentally sent to the whole company." },
  { id:67, idiom:"In the heat of the moment", meaning:"While feeling very emotional; without thinking carefully first.", ex:"She said things in the heat of the moment that she later deeply regretted." },
  { id:68, idiom:"In the same boat", meaning:"In the same difficult or unpleasant situation as others.", ex:"None of us had experienced this before — we were all in the same boat." },
  { id:69, idiom:"It takes two to tango", meaning:"Both people involved in a situation are equally responsible for it.", ex:"Don't blame only him — it takes two to tango." },
  { id:70, idiom:"Kill two birds with one stone", meaning:"To accomplish two things with a single action.", ex:"By cycling to work, she killed two birds with one stone: saving money and staying fit." },
  { id:71, idiom:"Leave no stone unturned", meaning:"To try every possible course of action in order to achieve something.", ex:"The detective left no stone unturned in her search for the missing evidence." },
  { id:72, idiom:"Let sleeping dogs lie", meaning:"To avoid bringing up old problems or conflicts that have been forgotten.", ex:"The issue had been resolved years ago — he thought it best to let sleeping dogs lie." },
  { id:73, idiom:"Like a fish out of water", meaning:"Uncomfortable in one's situation; not fitting in.", ex:"Moving from a small town to the capital, she felt like a fish out of water for months." },
  { id:74, idiom:"Look before you leap", meaning:"Think carefully before acting; consider consequences in advance.", ex:"Before resigning without another job lined up, look before you leap." },
  { id:75, idiom:"Lose your train of thought", meaning:"To forget what you were saying or thinking.", ex:"The interruption caused him to lose his train of thought completely." },
  { id:76, idiom:"Make ends meet", meaning:"To have just enough money to cover one's expenses.", ex:"With two part-time jobs, she barely made ends meet each month." },
  { id:77, idiom:"Make hay while the sun shines", meaning:"Take advantage of a favorable situation while it lasts.", ex:"Business is booming right now, so make hay while the sun shines." },
  { id:78, idiom:"Mend fences", meaning:"To repair a damaged relationship.", ex:"After the argument, he called his brother to mend fences." },
  { id:79, idiom:"Move the goalposts", meaning:"To change the rules or aims of a process in an unfair way.", ex:"Every time they met the target, the client moved the goalposts." },
  { id:80, idiom:"Neck and neck", meaning:"Two competitors who are very close or equal in a race or contest.", ex:"The candidates were neck and neck in every poll leading up to election day." },
  { id:81, idiom:"No pain, no gain", meaning:"You must suffer or work hard to achieve something worthwhile.", ex:"She pushed through every difficult training session knowing no pain, no gain." },
  { id:82, idiom:"Not my cup of tea", meaning:"Something that is not to one's taste or preference.", ex:"Loud parties are really not my cup of tea — I prefer a quiet dinner with friends." },
  { id:83, idiom:"Off the beaten path", meaning:"In an unfamiliar or unusual location; away from typical places.", ex:"They discovered a charming village completely off the beaten path." },
  { id:84, idiom:"Off the top of your head", meaning:"Said immediately, without thinking carefully or checking facts.", ex:"Off the top of my head, I'd say the project will take about three months." },
  { id:85, idiom:"On thin ice", meaning:"In a risky or precarious situation.", ex:"After two warnings, he knew he was on thin ice with the new management." },
  { id:86, idiom:"Once bitten, twice shy", meaning:"After a bad experience you are more careful to avoid similar situations.", ex:"She invested cautiously after her earlier losses — once bitten, twice shy." },
  { id:87, idiom:"Out of the blue", meaning:"Suddenly and unexpectedly; without any warning.", ex:"Out of the blue, he called to say he'd be flying in that weekend." },
  { id:88, idiom:"Out of the frying pan into the fire", meaning:"Moving from a bad situation directly into an even worse one.", ex:"He left the difficult job only to find himself out of the frying pan into the fire." },
  { id:89, idiom:"Penny wise, pound foolish", meaning:"Careful with small amounts of money but wasteful with large amounts.", ex:"Buying cheap tools that broke quickly was penny wise, pound foolish." },
  { id:90, idiom:"Pick up the slack", meaning:"To do the work that someone else is not doing.", ex:"When the team leader was ill, everyone pitched in to pick up the slack." },
  { id:91, idiom:"Play your cards right", meaning:"To take advantage of opportunities cleverly to achieve a desired result.", ex:"If you play your cards right, this meeting could lead to a promotion." },
  { id:92, idiom:"Pour cold water on", meaning:"To discourage or douse enthusiasm for an idea or plan.", ex:"He poured cold water on every idea she suggested without offering alternatives." },
  { id:93, idiom:"Put your best foot forward", meaning:"To make a good impression; to start something as well as possible.", ex:"It's your first day — put your best foot forward and make it count." },
  { id:94, idiom:"Put your foot in your mouth", meaning:"To say something embarrassing, hurtful, or inappropriate by mistake.", ex:"He really put his foot in his mouth by forgetting the client's name mid-sentence." },
  { id:95, idiom:"Read between the lines", meaning:"To understand the hidden or implicit meaning of something.", ex:"She never said she was unhappy, but if you read between the lines it was obvious." },
  { id:96, idiom:"Rub someone the wrong way", meaning:"To irritate or annoy someone.", ex:"His condescending tone rubbed everyone in the room the wrong way immediately." },
  { id:97, idiom:"Run circles around someone", meaning:"To be far more skillful than someone else.", ex:"The intern ran circles around some of the senior developers." },
  { id:98, idiom:"Saved by the bell", meaning:"Rescued from a difficult situation just in time.", ex:"He hadn't finished the report, but the meeting was postponed — saved by the bell." },
  { id:99, idiom:"Shoot yourself in the foot", meaning:"To do something that harms your own interests.", ex:"By antagonizing the press, the campaign shot itself in the foot." },
  { id:100, idiom:"Sitting on the fence", meaning:"Refusing to commit to a position on a controversial issue.", ex:"With the vote approaching, he could no longer afford to keep sitting on the fence." },
  { id:101, idiom:"Skeleton in the closet", meaning:"A hidden, embarrassing fact or secret from someone's past.", ex:"Every family has at least one skeleton in the closet, whether they admit it or not." },
  { id:102, idiom:"Speak volumes", meaning:"To convey a great deal without using words; to be very significant.", ex:"The way she handled the crisis spoke volumes about her character." },
  { id:103, idiom:"Spanner in the works", meaning:"Something or someone that prevents a plan from succeeding.", ex:"The new regulation threw a spanner in the works of their expansion plans." },
  { id:104, idiom:"Start from scratch", meaning:"To begin something again from the very beginning.", ex:"The data was lost, so the team had to start from scratch." },
  { id:105, idiom:"Steal a march on someone", meaning:"To gain an advantage over a rival by acting before they do.", ex:"By launching in Q1, they stole a march on every competitor." },
  { id:106, idiom:"Step up to the plate", meaning:"To take on a challenge or responsibility willingly.", ex:"When the team needed leadership, she stepped up to the plate without hesitation." },
  { id:107, idiom:"Stick to your guns", meaning:"To maintain your position even when under pressure to change it.", ex:"Despite the criticism, she stuck to her guns and the results proved her right." },
  { id:108, idiom:"Straight from the horse's mouth", meaning:"From the original or most reliable source.", ex:"I heard it straight from the horse's mouth — the CEO confirmed the restructuring." },
  { id:109, idiom:"Strike while the iron is hot", meaning:"To take advantage of a favorable opportunity immediately.", ex:"He had the investor's attention, so he struck while the iron was hot." },
  { id:110, idiom:"Take the bull by the horns", meaning:"To tackle a difficult situation directly and with confidence.", ex:"Instead of worrying, she took the bull by the horns and confronted the problem." },
  { id:111, idiom:"Teach someone a lesson", meaning:"To make someone experience the consequences of their bad behavior.", ex:"Losing the account taught them a lesson about ignoring client feedback." },
  { id:112, idiom:"The best of both worlds", meaning:"Enjoying two different advantages simultaneously.", ex:"Working from home gave her the best of both worlds — flexibility and focus." },
  { id:113, idiom:"The bigger the better", meaning:"Larger versions of something are preferred.", ex:"When it comes to concert venues, he always said the bigger the better." },
  { id:114, idiom:"The devil is in the detail", meaning:"Seemingly minor details can cause major problems if overlooked.", ex:"The contract looked simple, but the devil is in the detail — read every clause." },
  { id:115, idiom:"The early bird catches the worm", meaning:"Those who start early or act promptly gain an advantage.", ex:"She arrived an hour before the sale opened — the early bird catches the worm." },
  { id:116, idiom:"The grass is always greener", meaning:"Other people's situations always seem more desirable than one's own.", ex:"He kept wanting a different career, but the grass is always greener on the other side." },
  { id:117, idiom:"The proof is in the pudding", meaning:"The true value of something can only be judged by trying it or seeing its results.", ex:"The product was promising, but the proof would be in the pudding after launch." },
  { id:118, idiom:"The whole nine yards", meaning:"Everything possible; the full extent of something.", ex:"She decorated the house for the party — fairy lights, banners, the whole nine yards." },
  { id:119, idiom:"Think outside the box", meaning:"To think creatively and unconventionally; to consider solutions beyond the obvious.", ex:"The challenge required them to think outside the box to find a viable solution." },
  { id:120, idiom:"Through thick and thin", meaning:"Under all circumstances, both good and bad.", ex:"They had supported each other through thick and thin for thirty years." },
  { id:121, idiom:"Throw caution to the wind", meaning:"To do something without worrying about the risk.", ex:"She threw caution to the wind and booked a one-way ticket." },
  { id:122, idiom:"Throw in the towel", meaning:"To admit defeat; to give up.", ex:"After months of struggle, he threw in the towel and closed the business." },
  { id:123, idiom:"Tie the knot", meaning:"To get married.", ex:"After a five-year engagement, they finally tied the knot in a small ceremony." },
  { id:124, idiom:"Time flies", meaning:"Time passes much more quickly than one expects.", ex:"It's already your tenth anniversary? Time flies when you're building something great." },
  { id:125, idiom:"To each their own", meaning:"Everyone has different tastes and preferences, which should be respected.", ex:"She preferred working nights; to each their own." },
  { id:126, idiom:"Tongue in cheek", meaning:"Stated or done in a way that is not meant to be taken seriously; humorously ironic.", ex:"His complaints about being too successful were entirely tongue in cheek." },
  { id:127, idiom:"Turn a blind eye", meaning:"To pretend not to notice something; to deliberately ignore wrongdoing.", ex:"Management turned a blind eye to the toxic culture for far too long." },
  { id:128, idiom:"Turn over a new leaf", meaning:"To change one's behavior for the better; to make a fresh start.", ex:"After the health scare, he turned over a new leaf and gave up junk food entirely." },
  { id:129, idiom:"Two heads are better than one", meaning:"Collaborating with others produces better results than working alone.", ex:"They struggled alone for weeks, then paired up — two heads are better than one." },
  { id:130, idiom:"Under someone's thumb", meaning:"Controlled by someone else.", ex:"She felt completely under her boss's thumb and unable to make decisions independently." },
  { id:131, idiom:"Up in the air", meaning:"Uncertain; not yet decided.", ex:"The merger is still up in the air — no decision has been made." },
  { id:132, idiom:"Upset the apple cart", meaning:"To disturb a satisfactory situation; to cause problems unexpectedly.", ex:"His sudden resignation upset the apple cart just days before the product launch." },
  { id:133, idiom:"Wait for the other shoe to drop", meaning:"To wait for an expected event — often unpleasant — to happen.", ex:"The company had made several cuts, so everyone was waiting for the other shoe to drop." },
  { id:134, idiom:"Walk on eggshells", meaning:"To be very careful about what you say or do to avoid upsetting someone.", ex:"Ever since the argument, she had been walking on eggshells around him." },
  { id:135, idiom:"Water under the bridge", meaning:"Events that are in the past and should no longer be a source of concern.", ex:"They had their differences, but that was all water under the bridge now." },
  { id:136, idiom:"We'll cross that bridge when we come to it", meaning:"We'll deal with that problem if and when it arises.", ex:"Worrying about expansion right now is pointless — we'll cross that bridge when we come to it." },
  { id:137, idiom:"When pigs fly", meaning:"Something will never happen.", ex:"He'll apologize when pigs fly — he never admits he's wrong." },
  { id:138, idiom:"Win hands down", meaning:"To win easily and by a large margin.", ex:"Their product won hands down in every user satisfaction survey." },
  { id:139, idiom:"Wolf in sheep's clothing", meaning:"A person who appears friendly but is actually dangerous or deceptive.", ex:"The charming consultant turned out to be a wolf in sheep's clothing." },
  { id:140, idiom:"Work your fingers to the bone", meaning:"To work extremely hard.", ex:"She worked her fingers to the bone for years before the business became profitable." },
  { id:141, idiom:"Wrap your head around something", meaning:"To understand something complex.", ex:"It took her a week to wrap her head around the new accounting system." },
  { id:142, idiom:"You can't have your cake and eat it too", meaning:"You can't have everything; you must choose between two incompatible options.", ex:"He wanted a high salary and full flexibility — you can't have your cake and eat it too." },
  { id:143, idiom:"You can't judge a book by its cover", meaning:"Outward appearances are not a reliable guide to character.", ex:"He seemed unassuming, but you can't judge a book by its cover — he was extraordinary." },
  { id:144, idiom:"You reap what you sow", meaning:"Your actions and decisions determine your outcomes.", ex:"He had neglected relationships for years, and he reaped what he sowed when no one came to help." },
  { id:145, idiom:"Your guess is as good as mine", meaning:"I have no idea; I know as little as you about this topic.", ex:"What the new policy means for us? Your guess is as good as mine." },
  { id:146, idiom:"Zero in on", meaning:"To focus closely on a specific target or issue.", ex:"The investigation zeroed in on a single transaction that changed everything." },
  { id:147, idiom:"A blessing in disguise", meaning:"An apparent misfortune that leads to an unexpectedly good outcome.", ex:"Missing the promotion was a blessing in disguise — the role he got instead was far better." },
  { id:148, idiom:"A drop in the bucket", meaning:"A very small amount compared to the overall requirement.", ex:"The fundraiser raised a lot, but it was a drop in the bucket compared to the project cost." },
  { id:149, idiom:"A hard nut to crack", meaning:"A difficult problem to solve or a difficult person to understand.", ex:"Convincing the committee was a hard nut to crack, but she managed it." },
  { id:150, idiom:"A hot potato", meaning:"A controversial issue that is difficult to deal with.", ex:"Immigration policy is always a political hot potato during election season." },
  { id:151, idiom:"A leopard can't change its spots", meaning:"People cannot change their fundamental nature.", ex:"He promised to be more organized, but a leopard can't change its spots." },
  { id:152, idiom:"A picture is worth a thousand words", meaning:"A visual can convey meaning more effectively than a lengthy description.", ex:"Instead of a report, she used one infographic — a picture is worth a thousand words." },
  { id:153, idiom:"A penny for your thoughts", meaning:"Used to ask someone what they're thinking about.", ex:"You've been quiet for ages — a penny for your thoughts." },
  { id:154, idiom:"A piece of cake", meaning:"Something that is very easy to do.", ex:"After all the preparation, the presentation was a piece of cake." },
  { id:155, idiom:"A rolling stone gathers no moss", meaning:"A person who keeps moving won't accumulate obligations or responsibilities.", ex:"He'd lived in ten cities — a rolling stone gathers no moss." },
  { id:156, idiom:"A stitch in time saves nine", meaning:"Dealing with a problem promptly prevents it from becoming much worse.", ex:"She fixed the small leak immediately — a stitch in time saves nine." },
  { id:157, idiom:"Against all odds", meaning:"Despite very low probability; in circumstances where success was very unlikely.", ex:"Against all odds, the small startup outperformed every industry giant." },
  { id:158, idiom:"All bark and no bite", meaning:"Threatening or aggressive in words but not in actions.", ex:"He always shouted in meetings, but he was all bark and no bite." },
  { id:159, idiom:"All in the same boat", meaning:"In the same difficult situation as everyone else.", ex:"When the system crashed, the whole department was all in the same boat." },
  { id:160, idiom:"All roads lead to Rome", meaning:"There are many different ways to achieve the same goal.", ex:"Whether you use code or no-code tools, all roads lead to Rome in software." },
  { id:161, idiom:"All that glitters is not gold", meaning:"Outwardly attractive things are not always as valuable as they seem.", ex:"The deal looked perfect on paper, but all that glitters is not gold." },
  { id:162, idiom:"An apple a day keeps the doctor away", meaning:"Eating healthily helps maintain good health; taking preventive measures avoids problems.", ex:"She followed her doctor's advice on diet, believing an apple a day keeps the doctor away." },
  { id:163, idiom:"At the drop of a hat", meaning:"Without hesitation; immediately.", ex:"She'd travel to a new city at the drop of a hat if an opportunity arose." },
  { id:164, idiom:"Back to square one", meaning:"Back to the beginning; starting over after a failure.", ex:"The merger fell through, and they were back to square one." },
  { id:165, idiom:"Bad blood", meaning:"Feelings of hostility or resentment between people.", ex:"There's bad blood between those two divisions over a decade-old turf war." },
  { id:166, idiom:"Ball and chain", meaning:"Something that restricts freedom or weighs one down.", ex:"Debt became the ball and chain that prevented him from taking risks." },
  { id:167, idiom:"Bark worse than your bite", meaning:"To be less severe in action than in words.", ex:"The professor seemed harsh in emails, but her bark was worse than her bite." },
  { id:168, idiom:"Be on the ball", meaning:"To be alert, quick to understand, and competent.", ex:"She was always on the ball — you never had to explain anything twice." },
  { id:169, idiom:"Beat around the bush", meaning:"To avoid addressing a difficult topic directly.", ex:"Rather than beating around the bush, he said directly that the project was cancelled." },
  { id:170, idiom:"Bite off more than you can chew", meaning:"To take on more than you can realistically handle.", ex:"Three clients, two courses, and a blog — she had bitten off more than she could chew." },
  { id:171, idiom:"Blow your own trumpet", meaning:"To talk proudly about your own achievements.", ex:"He was excellent at his job but never one to blow his own trumpet." },
  { id:172, idiom:"Break new ground", meaning:"To be innovative; to do something that has not been done before.", ex:"The research team broke new ground with a method no other lab had attempted." },
  { id:173, idiom:"Bring home the bacon", meaning:"To earn money to support one's family.", ex:"She worked two jobs to bring home the bacon while her partner studied." },
  { id:174, idiom:"Burn bridges", meaning:"To permanently damage a relationship, making it impossible to return.", ex:"He burned bridges with every employer he ever had, which caught up with him." },
  { id:175, idiom:"By hook or by crook", meaning:"By any means possible; using whatever methods are necessary.", ex:"She was determined to finish the project by hook or by crook." },
  { id:176, idiom:"Catch someone off guard", meaning:"To surprise someone when they are unprepared.", ex:"The unexpected question caught him completely off guard." },
  { id:177, idiom:"Change of heart", meaning:"A change in one's feelings, attitude, or decision.", ex:"She had a change of heart and decided to stay with the company." },
  { id:178, idiom:"Chase your tail", meaning:"To spend a lot of effort without achieving anything.", ex:"Without a clear strategy, the team was just chasing its tail." },
  { id:179, idiom:"Clean slate", meaning:"A fresh start, free from past mistakes.", ex:"A new city gave him a clean slate and the chance to reinvent himself." },
  { id:180, idiom:"Clip someone's wings", meaning:"To limit someone's freedom or potential.", ex:"Over-regulation can clip entrepreneurs' wings before they even get off the ground." },
  { id:181, idiom:"Close call", meaning:"A narrow escape from danger or disaster.", ex:"The team avoided a costly error by a close call — one missed signature away from disaster." },
  { id:182, idiom:"Come full circle", meaning:"To return to the original position or situation after a period of change.", ex:"Her career had come full circle — she was now teaching what she had once been taught." },
  { id:183, idiom:"Come up trumps", meaning:"To produce a better result than expected; to succeed.", ex:"Against expectations, the small team came up trumps with the best proposal." },
  { id:184, idiom:"Compare apples and oranges", meaning:"To compare two fundamentally different things.", ex:"Judging a novel against a documentary is comparing apples and oranges." },
  { id:185, idiom:"Cook the books", meaning:"To falsify financial records.", ex:"The auditors discovered that someone had been cooking the books for years." },
  { id:186, idiom:"Cost a pretty penny", meaning:"To be very expensive.", ex:"That renovation cost a pretty penny, but the value of the home doubled." },
  { id:187, idiom:"Crack under pressure", meaning:"To fail or break down when faced with stress or difficulties.", ex:"She remained steady when others cracked under pressure." },
  { id:188, idiom:"Cutting edge", meaning:"The most advanced stage of development; at the forefront of something.", ex:"The laboratory was working on cutting-edge research in gene therapy." },
  { id:189, idiom:"Dark horse", meaning:"A candidate or competitor about whom little is known but who may do surprisingly well.", ex:"She was the dark horse of the tournament, reaching the final with no prior ranking." },
  { id:190, idiom:"Dead ringer", meaning:"A person or thing that is a perfect likeness of another.", ex:"He was a dead ringer for the actor — strangers kept stopping him for autographs." },
  { id:191, idiom:"Devil's advocate", meaning:"A person who argues against a position not necessarily their own, to stimulate debate.", ex:"She played devil's advocate to stress-test the team's reasoning before the board meeting." },
  { id:192, idiom:"Diamond in the rough", meaning:"A person or thing with great potential that is not yet fully developed.", ex:"The coach saw a diamond in the rough in the quiet kid who never played a full game." },
  { id:193, idiom:"Die hard", meaning:"Something that is very difficult to change or eliminate.", ex:"Old habits die hard — he still woke at six even on weekends." },
  { id:194, idiom:"Dig your own grave", meaning:"To do something that causes your own downfall.", ex:"By lying to the auditors, he dug his own grave." },
  { id:195, idiom:"Down to earth", meaning:"Practical, realistic, and unpretentious.", ex:"Despite her celebrity status, she was completely down to earth and easy to talk to." },
  { id:196, idiom:"Draw a blank", meaning:"To be unable to recall or come up with something.", ex:"He drew a blank when asked to name the capital — the question caught him off guard." },
  { id:197, idiom:"Drive a hard bargain", meaning:"To negotiate fiercely and very skillfully.", ex:"She drove a hard bargain and got the fee she wanted." },
  { id:198, idiom:"Drink like a fish", meaning:"To drink excessive amounts of alcohol.", ex:"The stories say he drank like a fish, though he was always sharp at work." },
  { id:199, idiom:"Easy does it", meaning:"To do something gently and carefully, without rushing.", ex:"Easy does it — the frame is fragile and the screws are already stripped." },
  { id:200, idiom:"Eat humble pie", meaning:"To admit one was wrong and act in a humble way.", ex:"After his bold prediction failed, he had to eat humble pie in front of the whole team." },
  { id:201, idiom:"Elbow room", meaning:"Space to move freely; freedom to act.", ex:"The new office gave the creative team the elbow room they needed to think differently." },
  { id:202, idiom:"Eleventh hour", meaning:"At the last possible moment; narrowly avoiding a deadline.", ex:"The deal was saved at the eleventh hour by a last-minute compromise." },
  { id:203, idiom:"Every dog has its day", meaning:"Everyone will have a moment of success or good luck at some point.", ex:"He was overlooked for years, but every dog has its day — his moment finally came." },
  { id:204, idiom:"Fall by the wayside", meaning:"To fail to progress; to be abandoned or forgotten.", ex:"Many startup ideas fall by the wayside without proper funding or execution." },
  { id:205, idiom:"Fall flat", meaning:"To fail to produce the intended effect; to have no impact.", ex:"His attempt at humor fell flat in the serious atmosphere of the meeting." },
  { id:206, idiom:"Feather in your cap", meaning:"An achievement or distinction that brings honor or recognition.", ex:"Winning the national award was a real feather in her cap." },
  { id:207, idiom:"Feel under the weather", meaning:"To feel slightly ill or not entirely well.", ex:"She took the day off feeling under the weather and was back to full strength the next day." },
  { id:208, idiom:"Fine-tooth comb", meaning:"To examine something very carefully and in great detail.", ex:"Every clause in the contract was reviewed with a fine-tooth comb." },
  { id:209, idiom:"Fire on all cylinders", meaning:"To perform at full capability; to work with maximum effort.", ex:"The team was firing on all cylinders in the final weeks before the launch." },
  { id:210, idiom:"Fit the bill", meaning:"To be exactly right or suitable for a particular purpose.", ex:"The venue was perfect — it fit the bill in every way." },
  { id:211, idiom:"Flash in the pan", meaning:"Something that shows great initial promise but ultimately fails to deliver.", ex:"His first film was a flash in the pan — the follow-up was universally panned." },
  { id:212, idiom:"Fly in the ointment", meaning:"A minor irritation that spoils the success or enjoyment of something.", ex:"The one fly in the ointment was the unexpected fee that emerged on signing day." },

/* ============================================================
   LOCALSTORAGE HELPERS
============================================================ */
const LS = {
  get(k, fallback = null) {
    try {
      const v = localStorage.getItem(k);
      return v !== null ? JSON.parse(v) : fallback;
    } catch { return fallback; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
  }
};

/* ============================================================
   DATE HELPERS  — all dates in Asia/Manila timezone
============================================================ */
const TZ = 'Asia/Manila';

/** Returns today's date string in Manila as "YYYY-MM-DD" */
function todayStr() {
  return new Date().toLocaleDateString('en-CA', { timeZone: TZ }); // en-CA = YYYY-MM-DD
}

/** Returns yesterday's date string in Manila as "YYYY-MM-DD" */
function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toLocaleDateString('en-CA', { timeZone: TZ });
}

/** Number of full calendar days between two "YYYY-MM-DD" strings */
function daysBetween(aStr, bStr) {
  const msPerDay = 86400000;
  return Math.round((new Date(bStr) - new Date(aStr)) / msPerDay);
}

/** Friendly date label in Manila time */
function displayDate() {
  return new Date().toLocaleDateString('en-US', {
    timeZone: TZ,
    weekday: 'long', month: 'long', day: 'numeric'
  });
}

/* ============================================================
   SHUFFLE  (Fisher-Yates)
============================================================ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   DAILY CONTENT LOGIC
   Non-repetitive: shuffled queue stored in localStorage.
   Each new calendar day pops the front ID.
   When queue empties, it refills with a fresh shuffle —
   so all 30 entries appear before any repeat.
============================================================ */
function pickNextWord() {
  let q = LS.get('wordQueue', []);
  if (!q.length) q = shuffle(WORDS.map(w => w.id));
  const id = q.shift();
  LS.set('wordQueue', q);
  return WORDS.find(w => w.id === id) || WORDS[0];
}

function pickNextIdiom() {
  let q = LS.get('idiomQueue', []);
  if (!q.length) q = shuffle(IDIOMS.map(i => i.id));
  const id = q.shift();
  LS.set('idiomQueue', q);
  return IDIOMS.find(i => i.id === id) || IDIOMS[0];
}

// Peek without consuming — used for Preview Next
function peekNextWord() {
  const q = LS.get('wordQueue', []);
  const src = q.length ? q : shuffle(WORDS.map(w => w.id));
  return WORDS.find(w => w.id === src[0]) || WORDS[0];
}

function peekNextIdiom() {
  const q = LS.get('idiomQueue', []);
  const src = q.length ? q : shuffle(IDIOMS.map(i => i.id));
  return IDIOMS.find(i => i.id === src[0]) || IDIOMS[0];
}

function refreshDailyContentIfNeeded() {
  const today    = todayStr();
  const lastDate = LS.get('lastContentDate', '');

  if (lastDate !== today) {
    // New calendar day — pick fresh content
    currentWord  = pickNextWord();
    currentIdiom = pickNextIdiom();
    LS.set('lastContentDate', today);
    LS.set('currentWordId',   currentWord.id);
    LS.set('currentIdiomId',  currentIdiom.id);
  } else {
    // Same day — restore what was already chosen
    const wId = LS.get('currentWordId',  0);
    const iId = LS.get('currentIdiomId', 0);
    currentWord  = WORDS.find(w => w.id === wId)  || pickNextWord();
    currentIdiom = IDIOMS.find(i => i.id === iId) || pickNextIdiom();
  }
}

/* ============================================================
   STREAK LOGIC
   - currentStreak : consecutive days opened
   - longestStreak : highest streak ever
   - totalMissed   : cumulative missed days across all time
============================================================ */
function updateStreak() {
  const today      = todayStr();
  const lastDate   = LS.get('lastStreakDate', '');
  const savedCount = LS.get('streakCount',    0);

  longestStreak = LS.get('longestStreak', 0);
  totalMissed   = LS.get('totalMissed',   0);

  if (!lastDate) {
    // Very first open ever
    streak = 1;
  } else if (lastDate === today) {
    // Same day revisit — no change
    streak = Math.max(savedCount, 1);
  } else {
    const gap = daysBetween(lastDate, today); // how many days since last visit
    if (gap === 1) {
      // Consecutive day ✓
      streak = savedCount + 1;
    } else {
      // Missed one or more days — count them
      const missed = gap - 1;
      totalMissed += missed;
      LS.set('totalMissed', totalMissed);
      streak = 1;
    }
  }

  // Update longest if current beats it
  if (streak > longestStreak) {
    longestStreak = streak;
    LS.set('longestStreak', longestStreak);
  }

  LS.set('streakCount',    streak);
  LS.set('lastStreakDate', today);
}

/* ============================================================
   FAVORITES
============================================================ */
function loadFavorites() {
  favorites = LS.get('favorites', []);
}

function saveFavorites() {
  LS.set('favorites', favorites);
}

function isWordFav() {
  return currentWord && favorites.some(f => f.type === 'word' && f.entryId === currentWord.id);
}

function isIdiomFav() {
  return currentIdiom && favorites.some(f => f.type === 'idiom' && f.entryId === currentIdiom.id);
}

function toggleWordFav() {
  if (!currentWord) return;
  const idx = favorites.findIndex(f => f.type === 'word' && f.entryId === currentWord.id);
  if (idx >= 0) {
    favorites.splice(idx, 1);
    showToast('Removed from favorites');
  } else {
    favorites.unshift({ type: 'word', entryId: currentWord.id, title: currentWord.word, sub: currentWord.def });
    showToast('Saved to favorites ❤️');
  }
  saveFavorites();
  updateFavBtn('word');
  if (activeTab === 'fav') renderFavorites();
  popBtn('word-fav-btn');
}

function toggleIdiomFav() {
  if (!currentIdiom) return;
  const idx = favorites.findIndex(f => f.type === 'idiom' && f.entryId === currentIdiom.id);
  if (idx >= 0) {
    favorites.splice(idx, 1);
    showToast('Removed from favorites');
  } else {
    favorites.unshift({ type: 'idiom', entryId: currentIdiom.id, title: currentIdiom.idiom, sub: currentIdiom.meaning });
    showToast('Saved to favorites ❤️');
  }
  saveFavorites();
  updateFavBtn('idiom');
  if (activeTab === 'fav') renderFavorites();
  popBtn('idiom-fav-btn');
}

function deleteFav(type, entryId) {
  favorites = favorites.filter(f => !(f.type === type && f.entryId === entryId));
  saveFavorites();
  updateFavBtn('word');
  updateFavBtn('idiom');
  renderFavorites();
  showToast('Removed');
}

/* ============================================================
   PREVIEW NEXT  (testing only — does not consume the queue)
============================================================ */
function previewNext() {
  isPreviewMode = true;
  currentWord   = peekNextWord();
  currentIdiom  = peekNextIdiom();
  renderCards(true);
  document.getElementById('preview-badge').classList.add('visible');
  document.getElementById('back-btn').style.display = 'inline-flex';
}

function backToToday() {
  isPreviewMode = false;
  const wId = LS.get('currentWordId',  0);
  const iId = LS.get('currentIdiomId', 0);
  currentWord  = WORDS.find(w => w.id === wId)  || currentWord;
  currentIdiom = IDIOMS.find(i => i.id === iId) || currentIdiom;
  renderCards(true);
  document.getElementById('preview-badge').classList.remove('visible');
  document.getElementById('back-btn').style.display = 'none';
}

/* ============================================================
   SHARE
============================================================ */
function shareWord() {
  if (!currentWord) return;
  const text = `📖 Word of the Day: ${currentWord.word}\n🔊 ${currentWord.pron}\n\n${currentWord.def}\n\n"${currentWord.ex}"\n\n— Ken's Daily Dose of Knowledge`;
  doShare(text);
}

function shareIdiom() {
  if (!currentIdiom) return;
  const text = `💬 Idiom of the Day: ${currentIdiom.idiom}\n\n${currentIdiom.meaning}\n\n"${currentIdiom.ex}"\n\n— Ken's Daily Dose of Knowledge`;
  doShare(text);
}

function doShare(text) {
  if (navigator.share) {
    navigator.share({ text }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text)
      .then(() => showToast('Copied to clipboard!'))
      .catch(() => showToast('Unable to copy'));
  } else {
    showToast('Sharing not supported');
  }
}

/* ============================================================
   THEME
============================================================ */
function initTheme() {
  const saved = LS.get('theme', null);
  isDark = saved !== null
    ? saved === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(false);

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (LS.get('theme', null) === null) { isDark = e.matches; applyTheme(); }
  });
}

function toggleTheme() {
  isDark = !isDark;
  LS.set('theme', isDark ? 'dark' : 'light');
  applyTheme(true);
}

function applyTheme(animate = true) {
  if (!animate) document.body.style.transition = 'none';
  document.body.classList.toggle('dark', isDark);
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
  document.getElementById('theme-meta').setAttribute('content', isDark ? '#0D1E1E' : '#1D5C5C');
  if (!animate) requestAnimationFrame(() => document.body.style.transition = '');
}

/* ============================================================
   TAB NAVIGATION
============================================================ */
function switchTab(tab) {
  if (activeTab === tab) return;

  const fromPane = document.getElementById(`${activeTab}-pane`);
  const toPane   = document.getElementById(`${tab}-pane`);
  const fromBtn  = document.getElementById(`nav-${activeTab}`);
  const toBtn    = document.getElementById(`nav-${tab}`);

  fromPane.classList.add('exit-left');
  fromPane.classList.remove('active');

  setTimeout(() => fromPane.classList.remove('exit-left'), 280);

  toPane.classList.add('active');
  fromBtn.classList.remove('active');
  toBtn.classList.add('active');

  activeTab = tab;
  if (tab === 'fav') renderFavorites();
}

/* ============================================================
   TOAST
============================================================ */
let toastTimer = null;

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ============================================================
   RENDER  —  HEADER
============================================================ */
function renderHeader() {
  const s = streak;
  // Streak badge in header
  document.getElementById('streak-text').textContent = `${s} day${s !== 1 ? 's' : ''}`;
  document.getElementById('streak-fire').textContent = s > 1 ? '🔥' : '🕯️';
  document.getElementById('date-label').textContent  = displayDate();
  document.getElementById('day-pill').textContent    = `Day ${s}`;
  // Stats chips
  document.getElementById('stat-current').textContent = s;
  document.getElementById('stat-longest').textContent  = longestStreak;
  document.getElementById('stat-missed').textContent   = totalMissed;
}

/* ============================================================
   RENDER  —  CARDS
============================================================ */
function renderCards(reAnimate = false) {
  if (!currentWord || !currentIdiom) return;

  // Word
  document.getElementById('word-title').textContent = currentWord.word;
  document.getElementById('word-pron').textContent  = currentWord.pron;
  document.getElementById('word-def').textContent   = currentWord.def;
  document.getElementById('word-ex').textContent    = currentWord.ex;

  // Idiom
  document.getElementById('idiom-title').textContent   = `"${currentIdiom.idiom}"`;
  document.getElementById('idiom-meaning').textContent = currentIdiom.meaning;
  document.getElementById('idiom-ex').textContent      = currentIdiom.ex;

  updateFavBtn('word');
  updateFavBtn('idiom');

  if (reAnimate) triggerCardAnimation();
}

function triggerCardAnimation() {
  ['word-card', 'idiom-card'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('in');
    void el.offsetWidth; // force reflow
    el.classList.add('in');
  });
}

function updateFavBtn(type) {
  const btn  = document.getElementById(`${type}-fav-btn`);
  const fav  = type === 'word' ? isWordFav() : isIdiomFav();
  btn.textContent = fav ? '♥' : '♡';
  btn.classList.toggle('fav-on', fav);
}

/* ============================================================
   RENDER  —  FAVORITES TAB
============================================================ */
function renderFavorites() {
  const container = document.getElementById('fav-content');
  if (!favorites.length) {
    container.innerHTML = `
      <div class="fav-empty">
        <span class="fav-empty-icon">💔</span>
        <div class="fav-empty-title">No favorites yet</div>
        <div class="fav-empty-sub">Tap ♡ on any card<br>to save it here.</div>
      </div>`;
    return;
  }

  const words  = favorites.filter(f => f.type === 'word');
  const idioms = favorites.filter(f => f.type === 'idiom');
  let html = '';

  if (words.length) {
    html += `<div class="fav-sec-hdr">📖 Words <span class="fav-count">${words.length}</span></div>`;
    words.forEach(f => { html += favItemHTML(f); });
  }
  if (idioms.length) {
    html += `<div class="fav-sec-hdr" style="margin-top:${words.length ? '4px' : '0'}">💬 Idioms <span class="fav-count">${idioms.length}</span></div>`;
    idioms.forEach(f => { html += favItemHTML(f); });
  }

  container.innerHTML = html;
}

function favItemHTML(f) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  return `
    <div class="fav-item">
      <div class="fav-icon fav-icon-${f.type}">${f.type === 'word' ? '📖' : '💬'}</div>
      <div class="fav-body">
        <div class="fav-title">${esc(f.title)}</div>
        <div class="fav-sub">${esc(f.sub)}</div>
      </div>
      <button class="fav-del"
              data-type="${f.type}"
              data-id="${f.entryId}"
              onclick="deleteFav(this.dataset.type, +this.dataset.id)"
              title="Remove">✕</button>
    </div>`;
}

/* ============================================================
   HEART POP ANIMATION HELPER
============================================================ */
function popBtn(id) {
  const el = document.getElementById(id);
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}


/* ============================================================
   TEXT-TO-SPEECH
   Uses Web Speech API (SpeechSynthesis).
   Stops any in-progress speech before starting a new one.
   Falls back gracefully if unsupported.
============================================================ */
const TTS = {
  supported: typeof window !== 'undefined' && 'speechSynthesis' in window,
  speaking:  false,

  speak(text, btnId) {
    if (!this.supported) {
      showToast('Text-to-speech not supported on this device');
      return;
    }

    // Stop anything already playing
    window.speechSynthesis.cancel();

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang  = 'en-US';
    utter.rate  = 0.88;   // slightly slower — clearer for vocabulary
    utter.pitch = 1.0;

    const btn = btnId ? document.getElementById(btnId) : null;

    utter.onstart = () => {
      this.speaking = true;
      if (btn) btn.classList.add('tts-active');
    };

    utter.onend = utter.onerror = () => {
      this.speaking = false;
      if (btn) btn.classList.remove('tts-active');
    };

    // Small delay improves reliability on iOS Safari
    setTimeout(() => window.speechSynthesis.speak(utter), 120);
  }
};

function speakWord() {
  if (!currentWord) return;
  // Speak word + pronunciation for max clarity
  const text = `${currentWord.word}. ${currentWord.pron}. ${currentWord.word}.`;
  TTS.speak(text, 'word-tts-btn');
}

/* ============================================================
   INIT
============================================================ */
function init() {
  initTheme();
  loadFavorites();
  updateStreak();
  refreshDailyContentIfNeeded();
  renderHeader();
  renderCards(false);
  // Trigger card entrance animations after a short delay
  setTimeout(triggerCardAnimation, 60);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
